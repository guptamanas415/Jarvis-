name: Android CI / CD - JARVIS APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build JARVIS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Prepare Secrets & Configuration
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'YOUR_GEMINI_API_KEY_HERE' }}" > .env
          echo "GEMINI_API_KEY=YOUR_GEMINI_API_KEY_HERE" > .env.example

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Locate Generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
